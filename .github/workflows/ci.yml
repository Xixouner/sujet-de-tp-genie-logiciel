name: CI

on:
  push:
    branches: [ "main" ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - run: java --version
      - run: ./gradlew clean test jacocoTestReport jacocoTestCoverageVerification --no-daemon
